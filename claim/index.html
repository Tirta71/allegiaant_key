<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AllegiaantHub — Key Kamu</title>
<style>
  :root{
    --bg:#14161a; --card:#1b1f27; --row:#232833; --stroke:#333a47;
    --acc:#f5c82d; --acc-d:#d8ae1e; --green:#5ac878; --txt:#e8ebf0; --txt2:#9aa3b2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%,#1e2430 0,transparent 60%),var(--bg);
    color:var(--txt); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;min-height:100vh;
  }
  .card{
    width:100%;max-width:400px;background:var(--card);border:1px solid var(--stroke);
    border-radius:16px;padding:26px 24px;box-shadow:0 20px 60px rgba(0,0,0,.45);text-align:center;
  }
  .logo{width:56px;height:56px;margin:0 auto 12px;border-radius:14px;background:var(--row);
    border:1px solid var(--stroke);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .logo img{width:100%;height:100%;object-fit:contain}
  .logo span{font-size:26px}
  h1{margin:0 0 12px;font-size:22px;font-weight:800}
  h1 em{color:var(--acc);font-style:normal}
  .sub{color:var(--txt2);margin:6px 0}
  .sub.ok{color:var(--green);font-weight:700;font-size:16px}
  .spinner{width:38px;height:38px;margin:8px auto 12px;border:3px solid var(--stroke);
    border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .info{background:var(--row);border:1px solid var(--stroke);border-radius:10px;padding:12px;
    color:var(--txt2);font-size:12.5px;margin:12px 0}
  .keybox{display:flex;gap:8px;align-items:center;background:#101319;border:1px dashed var(--acc);
    border-radius:10px;padding:10px 12px;margin:10px 0}
  .keybox code{flex:1;font:600 14px ui-monospace,Menlo,Consolas,monospace;color:var(--acc);
    word-break:break-all;text-align:left}
  .copy{border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;
    background:var(--acc);color:#1a1a1a;white-space:nowrap}
  .copy.ok{background:var(--green)}
  .btn-link{display:inline-block;margin-top:8px;color:var(--acc);text-decoration:none;font-size:13px}
  .note{color:var(--txt2);font-size:11.5px;margin:12px 0 0}
  .foot{color:#5b6472;font-size:11px;margin-top:16px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo" id="logo"><span>🌿</span></div>
    <h1>Allegiaant<em>Hub</em></h1>
    <div id="body"><p class="sub">Menyiapkan…</p></div>
  </div>
  <div class="foot">© AllegiaantHub</div>

<script>
  var API_BASE="https://api.allegiaant.my.id";
  var CLAIM_STORAGE="alg_claim_id";
  var body=document.getElementById("body");
  var tries=0, alive=true, copied=false;

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  function renderNoId(){
    body.innerHTML='<p class="sub">Sesi ga ketemu.</p>'+
      '<div class="info">Buka halaman Get Key dulu terus selesaiin task-nya ya.</div>'+
      '<a class="btn-link" href="/">← Kembali ke Get Key</a>';
  }
  function renderPending(){
    body.innerHTML='<div class="spinner"></div><p class="sub">Nunggu konfirmasi task…</p>'+
      '<div class="info">Kalau kamu udah selesaiin semua task, key bakal muncul otomatis di sini. Jangan tutup halaman ini.</div>';
  }
  function renderExpired(){
    body.innerHTML='<p class="sub">Key device ini udah kadaluarsa.</p>'+
      '<div class="info">Ambil key baru buat device ini ya (selesaiin task lagi).</div>'+
      '<a class="btn-link" href="/'+(DID?("?hwid="+encodeURIComponent(DID)):"")+'">← Ambil Key Baru</a>';
  }
  function renderDone(key){
    body.innerHTML='<p class="sub ok">✅ Key kamu siap!</p>'+
      '<div class="keybox"><code id="k">'+esc(key)+'</code>'+
      '<button class="copy" id="cp">📋 Salin</button></div>'+
      '<p class="note">Berlaku 24 jam · kekunci ke 1 device. Paste key ini di GUI hub pas jalanin loader.</p>';
    document.getElementById("cp").addEventListener("click",function(){ copy(key,this); });
  }
  function copy(text,btn){
    try{ navigator.clipboard.writeText(text); }
    catch(e){ var ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta); }
    btn.textContent="✅ Tersalin"; btn.classList.add("ok");
    setTimeout(function(){ btn.textContent="📋 Salin"; btn.classList.remove("ok"); },1600);
  }

  // id device: HWID dari URL (dikirim /getkey), fallback localStorage. Dipakai global (renderExpired).
  var DID="";
  try{
    var q=new URLSearchParams(window.location.search).get("hwid")||"";
    if(q && q.indexOf("{")<0) DID=q.trim();
    if(!DID) DID=localStorage.getItem(CLAIM_STORAGE)||"";
  }catch(e){}

  // cb(status): {key} = siap, {expired:true} = kadaluarsa, null = pending.
  function check(uid,cb){
    fetch(API_BASE+"/api/lootlabs/claim?hwid="+encodeURIComponent(uid),{cache:"no-store"})
      .then(function(r){return r.json();})
      .then(function(j){
        if(j && j.ok && j.key){ cb({key:j.key}); }
        else if(j && j.expired){ cb({expired:true}); }
        else { cb(null); }
      })
      .catch(function(){ cb(null); });
  }

  (function(){
    if(!DID){ renderNoId(); return; }

    function loop(){
      if(!alive) return;
      check(DID,function(st){
        if(!alive) return;
        if(st && st.key){ renderDone(st.key); return; }
        if(st && st.expired){ renderExpired(); return; }
        tries++;
        renderPending();
        if(tries<40) setTimeout(loop, tries<10?2000:4000);
      });
    }
    loop();
  })();

  (function(){
    var img=new Image();
    img.onload=function(){ var l=document.getElementById("logo"); l.innerHTML=""; l.appendChild(img); };
    img.src="/logo.png";
  })();
</script>
</body>
</html>
